<body class="min-h-screen bg-slate-50 text-slate-900 antialiased">

    <!-- Title Only -->
    <header class="text-center mb-6">

        Sơ Đồ Chỗ Ngồi Tổ 4
      </h1>
    </header>

    <!-- Seating Chart -->
    <main class="bg-white border border-slate-200 rounded-2xl p-4 sm:p-6 shadow-sm">
      <div id="classroomLayout" class="space-y-3.5">
        <!-- Rendered by JS -->
      </div>
    </main>
  </div>

  <script>
    const DESKS = [
      {
        deskNumber: 6,

          badge: null,
          badgeType: null
        },

          shortName: 'Quốc Phúc',

          badgeType: 'leader'
        }
      },
      {
        deskNumber: 5,
        left: {
          shortName: 'Huy Hoàng',
          fullName: 'Nguyễn Huy Hoàng',
          badge: null,
          badgeType: null
        },
        right: {
          shortName: 'Minh Kha',
          fullName: 'Giảng Minh Kha',
          badge: null,
          badgeType: null
        }
      },
      {
        deskNumber: 4,
        left: {
          shortName: 'Hoài Phong',
          fullName: 'Trương Công Hoài Phong',
          badge: null,
          badgeType: null
        },
        right: {
          shortName: 'Tuyên Dương',
          fullName: 'Nguyễn Ngọc Tuyên Dương',
          badge: null,
          badgeType: null
        }
      },
      {
        deskNumber: 3,
        left: {
          shortName: 'Duy Khôi',
          fullName: 'Đặng Phùng Duy Khôi',
          badge: null,
          badgeType: null
        },
        right: {
          shortName: 'Thành Nhân',
          fullName: 'Nguyễn Thành Nhân',
          badge: null,
          badgeType: null
        }
      },
      {
        deskNumber: 2,
        left: {
          shortName: 'Ngân Bình',
          fullName: 'Đoàn Châu Ngân Bình',
          badge: null,
          badgeType: null
        },
        right: {
          shortName: 'Yến Phượng',
          fullName: 'Phan Ngọc Yến Phượng',
          badge: 'LPVN',
          badgeType: 'officer'
        }
      },
      {
        deskNumber: 1,
        left: {
          shortName: 'Thành Luân',
          fullName: 'Đỗ Thành Luân',
          badge: null,
          badgeType: null
        },
        right: {
          shortName: 'Quốc Sang',
          fullName: 'Nguyễn Hoàng Quốc Sang',
          badge: null,
          badgeType: null
        }
      }
    ];

    function renderBadge(badge, badgeType) {
      if (!badge) return '';
      if (badgeType === 'leader') {
        return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-amber-100 text-amber-800 border border-amber-200 shrink-0">${badge}</span>`;
      }
      return `<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-semibold bg-rose-100 text-rose-700 border border-rose-200 shrink-0">${badge}</span>`;
    }

    function renderSeat(seat) {
      return `
        <div class="seat-card rounded-xl border border-slate-200 bg-white px-3.5 py-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <div class="text-sm sm:text-[15px] font-bold text-slate-900 leading-tight">${seat.shortName}</div>
              <div class="text-xs text-slate-500 mt-0.5 leading-snug">${seat.fullName}</div>
            </div>
            ${renderBadge(seat.badge, seat.badgeType)}
          </div>
        </div>
      `;
    }

    function renderClassroom() {
      const container = document.getElementById('classroomLayout');
      container.innerHTML = DESKS.map(
        (desk) => `
          <div class="bg-slate-50/80 border-2 border-slate-300 rounded-2xl p-2.5 sm:p-3">
            <div class="px-1 mb-2">
              <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Bàn ${desk.deskNumber}</span>
            </div>
            <div class="grid grid-cols-2 gap-2.5">
              ${renderSeat(desk.left)}
              ${renderSeat(desk.right)}
            </div>
          </div>
        `
      ).join('');
    }

    renderClassroom();
  </script>
</body>
